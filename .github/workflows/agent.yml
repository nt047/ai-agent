name: AI Security Agent

on:
  issues:
    types: [opened]
  schedule:
    - cron: '0 * * * *'

permissions:
  issues: write
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 feedparser

      - name: Run collector
        run: python collector.py

      - name: Commit new knowledge
        run: |
          git config --local user.email "agent@example.com"
          git config --local user.name "AI Agent"
          git add knowledge_base/
          git diff --cached --quiet || git commit -m "جمع معلومات جديدة $(date -u +'%Y-%m-%d %H:%M:%S')"
          git push

  process-command:
    runs-on: ubuntu-latest
    needs: collect
    if: github.event_name == 'issues'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Learn from input
        if: startsWith(github.event.issue.body, 'تعلم:')
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os, requests
          from learn import extract_text_from_url, learn_from_text

          body = os.environ['ISSUE_BODY']
          content = body[4:].strip()
          if content.startswith('http'):
              text = extract_text_from_url(content)
              source = content
          else:
              text = content
              source = "نص يدوي"
          files = learn_from_text(text, source)

          token = os.environ['GITHUB_TOKEN']
          repo = os.environ['REPO']
          issue_number = os.environ['ISSUE_NUMBER']
          headers = {'Authorization': f'token {token}'}
          url = f'https://api.github.com/repos/{repo}/issues/{issue_number}/comments'
          comment = f"✅ تم التعلم من {source}. حفظت {len(files)} جزءًا."
          requests.post(url, headers=headers, json={'body': comment})
          PY

      - name: Query and answer
        if: startsWith(github.event.issue.body, 'سؤال:')
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os, requests
          from query import answer_question

          body = os.environ['ISSUE_BODY']
          question = body[5:].strip()
          reply = answer_question(question)

          token = os.environ['GITHUB_TOKEN']
          repo = os.environ['REPO']
          issue_number = os.environ['ISSUE_NUMBER']
          headers = {'Authorization': f'token {token}'}
          url = f'https://api.github.com/repos/{repo}/issues/{issue_number}/comments'
          requests.post(url, headers=headers, json={'body': reply})
          PY
